<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* === 全局样式与重置 === */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  /* 采用推特经典的亮色（Light Mode）背景，增加卡片悬浮层次感 */
  background: #f7f9fa;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Meiryo", sans-serif;
  color: #0f1419; /* 推特官方深黑文本色，极高可读性 */
  -webkit-font-smoothing: antialiased;
  padding: 20px;
}

/* === 单条推文卡片 === */
.tweet-card {
  width: 600px;
  background: #ffffff; /* 纯白底色 */
  border: 1px solid #cfd9de; /* 推特官方浅灰边框 */
  border-radius: 16px;
  padding: 20px;
  margin: 12px auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); /* 极轻微的阴影提升立体感 */
}
.tweet-header {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.tweet-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: #eff3f4;
  flex-shrink: 0;
  margin-right: 12px;
  overflow: hidden;
  border: 1px solid rgba(0, 0, 0, 0.04);
}
.tweet-avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.tweet-user {
  flex: 1;
  min-width: 0;
}
.tweet-name {
  font-size: 16px; font-weight: 800;
  color: #0f1419;
  line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tweet-name .verified {
  color: #1d9bf0; margin-left: 2px;
}
.tweet-handle {
  font-size: 14px; color: #536471; /* 推特次级文本灰 */
  margin-top: 2px;
}
.tweet-handle .time {
  color: #536471;
}
.tweet-handle .time::before { content: "\00b7"; margin: 0 6px; }

.tweet-body {
  padding-left: 0; /* 优化排版，文本对齐，避免过度缩进导致空间浪费 */
  margin-top: 8px;
}
.tweet-text {
  font-size: 15px; line-height: 1.5;
  color: #0f1419;
  margin-bottom: 12px;
  white-space: pre-wrap; word-wrap: break-word;
}

/* === 翻译区块 === */
.tweet-translation {
  font-size: 15px; line-height: 1.5;
  color: #0f1419;
  margin-bottom: 12px;
  padding: 12px 16px;
  background: #e8f5fe; /* 优雅的推特浅蓝背景 */
  border-left: 4px solid #1d9bf0; /* 蓝色高亮边缘 */
  border-radius: 0 12px 12px 0;
  white-space: pre-wrap; word-wrap: break-word;
}
.tweet-translation::before {
  content: "翻译自DeepSeek";
  display: block;
  font-size: 12px; font-weight: 700; color: #1d9bf0;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* === 媒体网格 === */
.tweet-media {
  margin: 12px 0;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #eff3f4;
}
.tweet-media img, .tweet-media video {
  width: 100%; display: block;
}
.tweet-media-grid {
  display: grid; gap: 2px;
}
.tweet-media-grid.cols-1 { grid-template-columns: 1fr; }
.tweet-media-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid.cols-3 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid.cols-3 img:first-child { grid-column: 1 / -1; }
.tweet-media-grid.cols-4 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid img {
  width: 100%; height: 100%; object-fit: cover;
  aspect-ratio: 16/9;
}
.tweet-video-placeholder {
  display: grid;
  place-items: center;
  min-height: 160px;
  padding: 16px;
  color: #536471;
  background: #eff3f4;
  font-size: 14px;
  font-weight: 600;
}
/* === 互动数据 === */
.tweet-stats {
  display: flex; gap: 20px;
  padding: 12px 0 4px;
  border-top: 1px solid #eff3f4;
  margin-top: 16px;
  font-size: 14px; color: #536471;
}
.tweet-stats span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tweet-stats strong { color: #0f1419; font-weight: 700; }

/* === 底部链接 === */
.tweet-footer {
  font-size: 14px; color: #536471;
  padding-top: 12px;
  text-align: center;
}
.tweet-footer a {
  color: #1d9bf0; text-decoration: none; font-weight: 600;
}

/* === 线程连线与气泡标签 === */
.thread-arrow {
  text-align: center;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  color: #536471;
  background: #eff3f4;
  border: 1px solid #cfd9de;
  padding: 5px 14px;
  border-radius: 20px;
  margin: -4px auto;
  width: fit-content;
  position: relative;
  z-index: 10;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  letter-spacing: 0.5px;
}
.reply-badge {
  display: inline-block;
  font-size: 13px; color: #1d9bf0;
  margin-bottom: 8px;
}

/* === 嵌套式引用卡片 === */
.quote-card {
  border: 1px solid #cfd9de;
  background: #f7f9fa; /* 内敛浅灰底色，与外部白底区分 */
  border-radius: 16px;
  padding: 12px;
  margin-top: 12px;
  transition: background 0.2s ease;
}
.quote-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.quote-avatar {
  width: 20px; height: 20px; border-radius: 50%;
  background: #eff3f4; overflow: hidden;
}
.quote-avatar img { width: 100%; height: 100%; object-fit: cover; }
.quote-name {
  font-size: 14px; font-weight: 700; color: #0f1419;
}
.quote-handle {
  font-size: 14px; color: #536471;
}
.quote-text {
  font-size: 14px; line-height: 1.4; color: #0f1419;
  white-space: pre-wrap; word-wrap: break-word;
}
.quote-translation {
  font-size: 13px; line-height: 1.4; color: #536471;
  margin-top: 4px;
  padding: 6px 10px;
  background: #e8f5fe;
  border-radius: 8px;
  white-space: pre-wrap; word-wrap: break-word;
}
.quote-media {
  margin-top: 8px; border-radius: 12px; overflow: hidden;
  border: 1px solid #eff3f4;
}
.quote-media img { width: 100%; display: block; }

/* === 直播通知（Light theme glow-up） === */
.live-alert {
  width: 600px;
  background: linear-gradient(135deg, #fff0f5, #f5f0ff); /* 梦幻浅粉紫渐变 */
  border: 1px solid #f91880;
  border-radius: 24px;
  padding: 24px;
  margin: 16px auto;
  text-align: center;
  box-shadow: 0 6px 20px rgba(249, 24, 128, 0.08);
}
.live-icon {
  font-size: 48px; margin-bottom: 12px;
}
.live-title {
  font-size: 22px; font-weight: 800; color: #0f1419;
  margin-bottom: 8px;
}
.live-members {
  font-size: 16px; color: #1d9bf0; font-weight: 600;
  margin-bottom: 12px;
}
.live-time {
  display: inline-block;
  background: rgba(249, 24, 128, 0.1);
  padding: 6px 16px; border-radius: 12px;
  font-size: 16px; color: #f91880; font-weight: 700;
  margin-bottom: 8px;
}
.live-note {
  font-size: 14px; color: #536471; margin-top: 8px;
}

/* 多卡片容器 */
.card-container {
  display: flex; flex-direction: column;
  align-items: center; padding: 16px 0;
}
.card-label {
  font-size: 13px; font-weight: 700; color: #536471;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 0 0 12px 0; text-align: center; width: 600px;
}
</style>
</head>
<body>
<div class="card-container">
{% block content %}{% endblock %}
</div>
</body>
</html>
