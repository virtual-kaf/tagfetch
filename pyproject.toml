[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-tagfetch"
version = "1.0.0"
description = "Fail-closed popular hashtag delivery for NoneBot OneBot V11"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.4.0",
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
    "emoji>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools]
include-package-data = false
packages = [
    "nonebot_plugin_tagfetch",
    "nonebot_plugin_tagfetch.clients",
    "nonebot_plugin_tagfetch.core",
    "nonebot_plugin_tagfetch.models",
    "nonebot_plugin_tagfetch.services",
    "nonebot_plugin_tagfetch.renderer",
    "nonebot_plugin_tagfetch.storage",
]
package-dir = {nonebot_plugin_tagfetch = "."}

[tool.setuptools.package-data]
"nonebot_plugin_tagfetch.renderer" = ["assets/*", "pillow_worker.py"]

[tool.nonebot]
plugins = ["nonebot_plugin_tagfetch"]
